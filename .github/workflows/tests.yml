name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-14
            python-version: "3.13"
          - os: macos-15-intel
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest -m "not integration and not vendor"

  open-format-integration:
    if: github.event_name == 'workflow_dispatch'
    name: Open formats / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ".[test]"
      - name: Run all open-format tests with coverage
        run: >-
          python -m pytest -m "not vendor"
          --cov=UniDecImporter --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-open-formats
          path: coverage.xml
          if-no-files-found: error

  thermo-integration:
    if: github.event_name == 'workflow_dispatch'
    name: Thermo RAW / Windows x86-64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
      - run: python -m pip install ".[test,thermo]"
      - run: python -m pytest tests/test_vendor_formats.py -m "vendor and integration" -k "thermo_"

  installed-wheel:
    name: Installed wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m build --wheel
      - run: python -m venv "${{ runner.temp }}/wheel-test"
      - run: "${{ runner.temp }}/wheel-test/bin/python -m pip install dist/*.whl"
      - name: Import and read outside source tree
        working-directory: ${{ runner.temp }}
        run: |
          printf "100 2\n101 3\n" > spectrum.txt
          wheel-test/bin/python -c "from UniDecImporter import get_importer; d=get_importer('spectrum.txt'); assert d.get_avg_scan().shape == (2, 2)"
