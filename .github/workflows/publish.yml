name: Build and publish

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Also publish release artifacts to PyPI?
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        env:
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -nE 's/^__version__[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' UniDecImporter/_version.py)"
          test -n "$version"
          tag="v$version"
          if [[ "${{ github.event_name }}" == "release" && "$PUBLISHED_TAG" != "$tag" ]]; then
            echo "Release tag does not match UniDecImporter/_version.py" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify licensed Thermo assets and reject other vendor binaries
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, tarfile, zipfile
          expected_thermo = {
              "thermofisher.commoncore.backgroundsubtraction.dll",
              "thermofisher.commoncore.data.dll",
              "thermofisher.commoncore.massprecisionestimator.dll",
              "thermofisher.commoncore.rawfilereader.dll",
          }
          for artifact in pathlib.Path("dist").iterdir():
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      names = archive.namelist()
              else:
                  with tarfile.open(artifact) as archive:
                      names = archive.getnames()
              lowered = [name.replace("\\", "/").lower() for name in names]
              thermo = {
                  pathlib.PurePosixPath(name).name
                  for name in lowered
                  if "/unidecimporter/thermo/" in f"/{name}" and name.endswith(".dll")
              }
              if thermo != expected_thermo:
                  raise SystemExit(
                      f"wrong Thermo DLL set in {artifact}: expected {sorted(expected_thermo)}, "
                      f"found {sorted(thermo)}"
                  )
              forbidden = [
                  name for name in lowered
                  if "/testdata/" in f"/{name}"
                  or name.endswith((".lib", ".tlb"))
                  or (
                      name.endswith(".dll")
                      and not (
                          "/unidecimporter/thermo/" in f"/{name}"
                          and pathlib.PurePosixPath(name).name in expected_thermo
                      )
                  )
              ]
              if forbidden:
                  raise SystemExit(f"forbidden files in {artifact}: {forbidden}")
              required_notices = (
                  "thermo_rawfilereader_terms.md",
                  "unidecimporter/thermo/rawfilereaderlicense.doc",
              )
              missing = [item for item in required_notices if not any(name.endswith(item) for name in lowered)]
              if missing:
                  raise SystemExit(f"missing Thermo license material in {artifact}: {missing}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  github-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes

  publish:
    if: >-
      always() &&
      (github.event_name == 'release' || github.event.inputs.publish_to_pypi == 'true') &&
      (github.event_name == 'release' || needs.github-release.result == 'success') &&
      needs.metadata.result == 'success' && needs.build.result == 'success'
    needs: [metadata, build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/unidecimporter
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
